---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Redis
  ansible.builtin.apt:
    name: "{{ redis_package }}"
    state: present

- name: Configure Redis
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ redis_config_file }}"
    owner: redis
    group: redis
    mode: "0644"
  notify: Restart Redis

- name: Ensure Redis is enabled and running
  ansible.builtin.service:
    name: "{{ redis_service }}"
    state: started
    enabled: true

- name: Verify Redis is responding
  ansible.builtin.command:
    cmd: redis-cli ping
  register: redis_ping
  changed_when: false

- name: Display Redis response
  ansible.builtin.debug:
    msg: "{{ redis_ping.stdout }}"